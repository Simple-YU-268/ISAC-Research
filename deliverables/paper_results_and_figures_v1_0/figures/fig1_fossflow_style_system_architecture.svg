    <linearGradient id="cpuTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75b9e8"/><stop offset="1" stop-color="#3c82bd"/></linearGradient>
    <linearGradient id="apTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9efff"/><stop offset="1" stop-color="#8ec5ec"/></linearGradient>
    <linearGradient id="apSide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5a9ac8"/><stop offset="1" stop-color="#2b669b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#17486f" flood-opacity=".20"/></filter>
