  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="94" fill="#103b60"/>
  <text x="70" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">CELL-FREE ISAC SYSTEM ARCHITECTURE</text>
  <text x="1440" y="57" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#bde3ff">Asymmetric sensing gating</text>

  <!-- fronthaul cloud and CPU -->
  <path d="M717 153c0-31 25-56 56-56 20 0 38 11 48 28 6-3 13-5 21-5 25 0 45 20 45 45 0 5-1 10-2 14h45c27 0 49 22 49 49s-22 49-49 49H728c-29 0-53-24-53-53 0-27 18-49 42-55z" fill="#dff3ff" stroke="#72b7df" stroke-width="3"/>
  <text x="749" y="187" class="label">Cloud fronthaul</text><text x="746" y="211" class="small">synchronization · data exchange</text>
  <g filter="url(#shadow)">
