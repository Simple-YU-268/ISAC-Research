  <g transform="translate(720 995)"><rect x="0" y="0" width="1120" height="56" rx="16" fill="#fff5eb" stroke="#efb37e" stroke-width="2"/><text x="28" y="36" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#9a4d16">bₘₚ authorizes dedicated sensing only — communication covariances remain globally cooperative.</text></g>
