    <g transform="translate(696 535)"><polygon points="0,42 96,7 190,42 94,77" fill="url(#apTop)" stroke="#3275a5" stroke-width="2"/><polygon points="0,42 94,77 94,142 0,106" fill="url(#apSide)" stroke="#3275a5" stroke-width="2"/><polygon points="94,77 190,42 190,106 94,142" fill="#397eaf" stroke="#3275a5" stroke-width="2"/><text x="60" y="62" class="node">AP 3</text><text x="55" y="101" fill="white" font-family="Arial" font-size="14">Nₜ antennas</text></g>
